# Places worth looking at, by name.
#
# A view id is the unit of comparison across commits: the same name renders the same frame today and
# after a change, which is what makes a screenshot evidence rather than an anecdote. Seed it with
# places that stress different things, not with places that are pretty.
#
#   cell    addressed the way Morrowind does: a pair of integers is an exterior, anything else is an
#           interior's name
#   pos     where the camera stands. Left out, it gets a view of the whole cell from outside — a
#           fine establishing shot for a town and useless for a room, where it puts the camera
#           outside the building and fills seven eighths of the frame with nothing. Every interior
#           here names one
#   look    what it points at
#   to      another view id, for a place a bench flies through rather than stands in. The camera
#           walks in a straight line from this one's pos and look to that one's, at `speed`, and
#           crosses whatever cell boundaries are on the way. Ignored by shot and by the window
#   speed   world units a second, required beside `to`. An exterior cell is 8,192 across, so this
#           times the run's length is roughly how many boundaries get crossed. The camera stops when
#           it arrives, so a run longer than the route ends standing at the far end
#   hour    the hour of day this place is looked at, from 0 up to 24. Left out, it stands at
#           whatever the run is at, which is noon unless `--hour` says otherwise; given, `--hour`
#           still wins. A place whose light is the point of it says so here, so a shot, a window and
#           a bench row of that id are one frame
#   weather what the sky over this place is doing, named as the content files spell it: Clear,
#           Cloudy, Foggy, Overcast, Rain, Thunderstorm, Ashstorm, Blight, Snow or Blizzard. The
#           hour's rule, over the other half of what a frame stands under — left out it takes the
#           run's, and `--weather` still wins
#   like    another view id to take the cell, pos and look from — the same place under another
#           light. Whatever this section states itself is kept. The view named has to state its own
#           place, and its route is not taken
#
# Press P in the window to print where it is standing: a comment line saying so in numbers a
# person reads, then the whole section below it, ready to paste in here as it stands.

[seyda-neen-ship]
note = where the game starts, on the deck looking at the town
cell = -2,-9
pos = -8292, -73376, 320
look = -12703, -70609, 200

[seyda-neen-ship-dawn]
note = the same deck at first light, where the sun is low, every shadow ray runs long and grazing and the moons are still up — the hour the frame budget is written against
like = seyda-neen-ship
hour = 6.5

[seyda-neen-ship-overcast]
note = the same deck under a heavy overcast, where every sunlit pixel is multiplied by a shadow no ray can find — the sky a gate on the sun's shadow ray has to be measured under
like = seyda-neen-ship
weather = Overcast

[seyda-neen-shore]
note = water, a shoreline, and the shallow seabed that makes caustics worth having
cell = -2,-9

# The camera is hand-placed, because the door that leads here names an arrival outside the room's
# own shell — a camera put there looks at the building from without. Every other interior takes the
# arrival.
[seyda-neen-customs]
note = a small lit room with no sky in it: a chandelier, rugs, tapestries and a guard
cell = Seyda Neen, Census and Excise Office
pos = -60, -40, 300
look = 280, 300, 240

[balmora]
note = a town on a river, seen from its bridge
cell = -3,-2
pos = -19216, -14896, 160
look = -19424, -12960, 60

[balmora-fog-night]
note = the same bridge in banked air at night, where the town's lamps are the only thing lighting the fog — what the volume's per-slice lamp rays are spent on
like = balmora
hour = 23
weather = Foggy

[balmora-storm-night]
note = rain over those same lamps, where every covering sprite walks the cell's lamp list again for every pixel it covers
like = balmora
hour = 23
weather = Thunderstorm

