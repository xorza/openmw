[island-crossing]
note = the Bitter Coast to the Ashlands at 12,000 units a second — twenty cell boundaries in ten seconds, so what a ring costs is most of the run. Six thousand up because the island rises past three: at that height thirty-two of the six hundred frames were inside the ground, seeing nothing farther than a couple of thousand units, and a frame nobody could stand in is not one to read
cell = -2,-9
pos = -8292, -73376, 6000
look = -7259, -71663, 5300
to = island-crossing-end
speed = 12000

[island-crossing-end]
note = where the crossing lands, eight cells east and twelve north of Seyda Neen
cell = 6,3
pos = 53248, 28672, 6000
look = 54281, 30385, 5300
