# Suites of places to profile, by name.
#
# A suite is a list of `views.cfg` ids and nothing else — the coordinates live there, so a place
# used for a picture and the same place used for a measurement cannot drift apart. Adding a suite
# here, or a name to one, is the whole of configuring what `openmw-rtxtool bench` runs.
#
#   views    view ids, comma separated, run in the order written
#   note     what the suite is for
#   settled  whether each hand-over waits for the distant ground it collects, on unless said
#            otherwise. A settled run is what makes two processes draw one picture; it is also what
#            puts a bake on the frame path — measured on `island-crossing`, the `bake` row reads
#            28 ms at the p99 against 0.04 ms with this off. **Off is what times the streaming
#            path**, and a run under it may not be compared with a picture
#
# `bench` runs [default] and `check` runs [check]. `--suite=<name>` picks another, `--views=a,b,c` runs an ad-hoc list, and
# `--views=all` runs every view in views.cfg.

[default]
note = what the frame budget is written against: a busy exterior at noon and at dawn, and a cluttered interior
views = seyda-neen-ship, seyda-neen-ship-dawn, balmora-mages-guild

[check]
note = what `check` asks its claims of: the budget's three places, and the crossing, because a route is the one thing that makes cells arrive under frames still in flight
views = seyda-neen-ship, seyda-neen-ship-dawn, balmora-mages-guild, island-crossing

[streaming]
note = the only suite whose camera goes anywhere — flown fast enough that what a cell costs is what the run measures
views = island-crossing
settled = false

[exteriors]
note = sky, terrain and distance — where the instance count is highest
views = seyda-neen-ship, seyda-neen-shore, balmora, vivec, ald-ruhn, sadrith-mora, dagon-fel

[skies]
note = the conditions the other suites never stand under — a heavy cloud deck, banked air at night and rain over the same lamps. The deck holds the most expensive trace in the corpus, the storm the most sprites over a pixel, and the fog is what the volume's own lamp rays are measured on
views = seyda-neen-ship-overcast, balmora-fog-night, balmora-storm-night

[interiors]
note = lamps, clutter and no sky — where the light count is highest and the bounce does the work
views = balmora-mages-guild, seyda-neen-customs, vivec-canalworks, addamasartus, arkngthand, andrano-tomb
