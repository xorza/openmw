# The fork's own CI: the ray-tracing build on Ubuntu and on Windows, through the same script the
# desk uses.
#
# **Upstream's workflows run beside this one, as the host engine's check.** They have no Vulkan
# SDK and no NGX, and macOS can have neither, so each of their three configures carries the one
# line the fork adds to them, `-D OPENMW_RTX=OFF`: push.yml for Ubuntu, windows.yml, and
# CI/before_script.macos.sh. What they prove is what this workflow cannot: that the tree still
# builds without the ray tracer, and upstream's own suites on three systems. Nothing here is
# switched off in the repository's settings, because a fresh fork does not carry a setting.
#
# **One job, two legs.** Everything after the dependencies is the same three lines on both
# systems, because `apps/rtxtool/rtx` is where the systems differ — so the workflow states the
# difference once, in the matrix and in the steps that fetch what each system lacks, and the
# build, the tests and the no-DLSS compile read as one. A leg that fails does not stop the other:
# what the two say together is what a change did.
#
# No hosted runner has a GPU, so every RTX test that needs a device skips at vkCreateInstance
# and the test step's skip count says so. What this proves is that both binaries compile on both
# compilers, the format check holds and the device-free tests pass; the gate stays on a box with
# a card.
#
# **A release is a tag, and the same two legs.** A push of a tag `rtx-v*` runs everything above
# and then, on each leg, the `package` flavour and the archive a player takes: an AppImage on
# Linux, which carries Qt, OSG, MyGUI and SDL and leaves Vulkan to the driver, and a zip on
# Windows, which is what a fork under a renderer nobody has installed before should be rather
# than an installer that registers itself where a stock OpenMW would. The release job then puts
# both on a draft release, to be read before it is published. The packaging can be tried without
# a tag: run the workflow by hand with `package` on, and the archives come back as artifacts.
#
# Every action is pinned to a full commit, the token can only read and is not left in the
# checkout — the one job that writes a release says so itself and runs on a tag alone — and a
# newer push cancels the run it supersedes.
name: Ray tracing

on:
  push:
    branches: [master]
    tags: [rtx-v*]
  pull_request:
  workflow_dispatch:
    inputs:
      package:
        description: Build the release archives as well, and keep them as artifacts
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The tag components/rtxvulkan/CMakeLists.txt asks FindNGX for, exactly.
  NGX_TAG: v310.7.0
  # Whether this run packages: on a release tag, or when asked by hand.
  PACKAGE: ${{ startsWith(github.ref, 'refs/tags/rtx-v') || inputs.package == true }}

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: clang-format 14, the version CI pins
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-14

      - run: CLANG_FORMAT=clang-format-14 CI/check_clang_format.sh

  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Each leg names its system and the Vulkan SDK it takes, with the checksum LunarG
        # publishes beside the file in its own listing (sdk.lunarg.com/sdk/files.json). The
        # backend needs VK_EXT_ray_tracing_invocation_reorder, which entered the SDK at 1.4.333;
        # the distro's packages and LunarG's apt repository stop short of it, so the SDK comes
        # from LunarG on both systems. Ubuntu is 24.04 by name and not ubuntu-latest, and not
        # 26.04: the OpenMW PPA the dependencies come from publishes for noble and no later LTS.
        # Windows is 2022 by name for the same reason: upstream's prebuilt dependency set is
        # built for its toolset.
        include:
          - os: ubuntu-24.04
            vulkan: 1.4.357.1
            vulkan-sha256: 4b41e3b30e8aedaa5dac7c136561ab463eb316a25a54e2c6245f2c299ea1fb85
            # What FindNGX reads on this system: the headers, the static library and the release
            # features, and neither the debug features nor the other system's.
            ngx: |
              include
              lib/Linux_x86_64/rel
          - os: windows-2022
            vulkan: 1.4.357.0
            vulkan-sha256: 81f474711e9042f4cd22b31b2f7a8870db2e428b21586fb43dd80150be97310d
            # The loader, which the SDK's installer does not carry and a runner with no driver
            # does not have: LunarG's runtime components, checksum from the same listing.
            vulkan-loader-sha256: a14672efed15aafc7f5a16572d35cd3a3416eadf670aeee3cdf50ee32d5fbf83
            ngx: |
              include
              lib/Windows_x86_64/rel
              lib/Windows_x86_64/x64
    defaults:
      run:
        # Git Bash on Windows, so every `run` here is the one script on both systems.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: OpenMW dependencies
        # Upstream's own list, plus what rtx asks for: Ninja and the system Google Test.
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository -y ppa:openmw/openmw
          sudo apt-get update
          sudo CI/install_debian_deps.sh gcc openmw-deps openmw-deps-dynamic
          sudo apt-get install -y ninja-build libgtest-dev libgmock-dev

      - name: OpenMW dependencies cache
        # Windows has no package for them: `rtx` fetches upstream's prebuilt set and SDL's own
        # package into deps/ at the first configure, and this keeps them between runs. The key
        # names the tag upstream pins and the script that pins SDL, so a bump of either fetches
        # afresh.
        if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: deps
          key: deps-${{ matrix.os }}-${{ hashFiles('CI/deps_versions.msvc.sh', 'apps/rtxtool/rtx') }}

      - name: Vulkan SDK cache
        id: vulkan
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vulkan-sdk
          # The workflow's own hash beside the version, because what is cached is what the steps
          # below extract, and a change to that list must not find the old subset.
          key: vulkan-sdk-${{ matrix.os }}-${{ matrix.vulkan }}-${{ hashFiles('.github/workflows/rtx.yml') }}

      - name: Vulkan SDK download
        if: steps.vulkan.outputs.cache-hit != 'true' && runner.os == 'Linux'
        # Only the four things the build needs out of 330 MB: the headers, the loader the tests
        # start against, glslc and spirv-val (both statically linked). No device, so no layers.
        # The loader sits in its own prefix, `lib/VulkanLoader`, which is where the SDK's
        # `setup-env.sh` points too.
        run: |
          tarball="vulkansdk-linux-x86_64-${{ matrix.vulkan }}.tar.xz"
          curl --fail --retry 3 -L -o "$tarball" \
            "https://sdk.lunarg.com/sdk/download/${{ matrix.vulkan }}/linux/${tarball}"
          echo "${{ matrix.vulkan-sha256 }}  ${tarball}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/vulkan-sdk"
          tar -xJf "$tarball" -C "${RUNNER_TEMP}/vulkan-sdk" --strip-components=1 --wildcards \
            '*/x86_64/include/*' '*/x86_64/lib/VulkanLoader/lib/libvulkan.so*' \
            '*/x86_64/bin/glslc' '*/x86_64/bin/spirv-val'

      - name: Vulkan SDK download
        if: steps.vulkan.outputs.cache-hit != 'true' && runner.os == 'Windows'
        # The same four things, out of a 288 MB installer that has no tarball beside it: it is
        # run unattended into a directory of its own, and the headers, the import library, glslc
        # and spirv-val are taken out of it. The loader comes separately, from the runtime
        # components LunarG publishes for redistribution: the installer leaves it to the driver,
        # and a runner has no driver. Everything else the installer put down is left behind.
        run: |
          installer="vulkansdk-windows-X64-${{ matrix.vulkan }}.exe"
          curl --fail --retry 3 -L -o "$installer" \
            "https://sdk.lunarg.com/sdk/download/${{ matrix.vulkan }}/windows/${installer}"
          echo "${{ matrix.vulkan-sha256 }}  ${installer}" | sha256sum -c -
          full="$(cygpath "$RUNNER_TEMP")/vulkan-sdk-installed"
          # Through PowerShell's own wait, since the installer is a windowed program and a shell
          # that does not wait on one would test for its files before it wrote them.
          powershell -NoProfile -Command "Start-Process -Wait -FilePath './$installer' -ArgumentList @('--root', '$(cygpath -w "$full")', '--accept-licenses', '--default-answer', '--confirm-command', 'install')"
          for file in Include/vulkan/vulkan.h Lib/vulkan-1.lib Bin/glslc.exe Bin/spirv-val.exe; do
            test -f "$full/$file"
          done

          loader="VulkanRT-X64-${{ matrix.vulkan }}-Components.zip"
          curl --fail --retry 3 -L -o "$loader" \
            "https://sdk.lunarg.com/sdk/download/${{ matrix.vulkan }}/windows/${loader}"
          echo "${{ matrix.vulkan-loader-sha256 }}  ${loader}" | sha256sum -c -

          sdk="$(cygpath "$RUNNER_TEMP")/vulkan-sdk"
          mkdir -p "$sdk/Lib" "$sdk/Bin"
          cp -r "$full/Include" "$sdk/"
          cp "$full/Lib/vulkan-1.lib" "$sdk/Lib/"
          cp "$full/Bin/glslc.exe" "$full/Bin/spirv-val.exe" "$sdk/Bin/"
          "/c/Program Files/7-Zip/7z.exe" e -y -o"$sdk/Bin" "$loader" "${loader%.zip}/x64/vulkan-1.dll" > /dev/null
          test -f "$sdk/Bin/vulkan-1.dll"

      - name: Vulkan SDK environment
        # What `setup-env.sh` would export: FindVulkan reads VULKAN_SDK for the headers and, on
        # Linux, CMAKE_PREFIX_PATH for the loader's prefix; the test binaries load the loader from
        # LD_LIBRARY_PATH or from the PATH beside glslc. Verified on a desk configure against the
        # same subset on both systems.
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sdk="${RUNNER_TEMP}/vulkan-sdk/x86_64"
            echo "VULKAN_SDK=${sdk}" >> "$GITHUB_ENV"
            echo "CMAKE_PREFIX_PATH=${sdk}/lib/VulkanLoader" >> "$GITHUB_ENV"
            echo "LD_LIBRARY_PATH=${sdk}/lib/VulkanLoader/lib" >> "$GITHUB_ENV"
            echo "${sdk}/bin" >> "$GITHUB_PATH"
          else
            sdk="$(cygpath "$RUNNER_TEMP")/vulkan-sdk"
            echo "VULKAN_SDK=$(cygpath -w "$sdk")" >> "$GITHUB_ENV"
            echo "$(cygpath -w "$sdk/Bin")" >> "$GITHUB_PATH"
          fi

      - name: NGX SDK
        # A sparse checkout of NVIDIA's public repository at the pinned tag, of what this leg's
        # system reads: about 150 MB either way.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NVIDIA/DLSS
          ref: ${{ env.NGX_TAG }}
          path: dlss
          persist-credentials: false
          sparse-checkout: ${{ matrix.ngx }}

      - name: NGX_ROOT, the one way FindNGX is pointed at a checkout
        run: echo "NGX_ROOT=${GITHUB_WORKSPACE}/dlss" >> "$GITHUB_ENV"

      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ github.job }}-${{ matrix.os }}
          max-size: 1000M

      - name: Build
        run: apps/rtxtool/rtx debug build

      - name: Test
        run: apps/rtxtool/rtx debug test --without-device

      - name: The backend without DLSS
        run: apps/rtxtool/rtx nodlss build openmw-rtx-vulkan

      - name: Package
        if: env.PACKAGE == 'true'
        # The portable layout, installed whole, then wrapped the way each system takes it.
        #
        # **The AppImage, the way the format's own guide says to make one.** The layout goes under
        # `usr/bin`, since the binaries find their openmw.cfg beside themselves and the launcher
        # starts the game from its own directory; the desktop file, the icon and the metainfo move
        # up to `usr/share`, where the tools and a desktop integrator look for them. The runtime
        # at the front of the file is the static one, pinned here by release and checksum: it runs
        # on FUSE 2, FUSE 3 or none, where the old runtime dies on every distribution that has
        # dropped libfuse2, and without it appimagetool fetches whatever the runtime's continuous
        # release holds that day. Qt's X11 platform alone, which runs through XWayland on a Wayland
        # session: the plugin's pinned release bundles the Wayland platform on request but not the
        # shell and buffer integrations it needs beside it, and a Wayland window without a shell
        # never maps. The Vulkan loader stays out, because the
        # one on a player's machine is the one that matches their driver. The update information
        # points AppImageUpdate at this repository's releases and writes the `.zsync` beside the
        # file. AppStream validation is off: upstream's metainfo carries warnings appstreamcli
        # refuses, and its identity, the launcher's desktop id, is right. The tools are AppImages
        # themselves and a runner has no FUSE, so they extract and run. It is built on 24.04, so it
        # runs on distributions with glibc 2.39 or later, which is 2024's.
        #
        # The zip is cpack's, off the same install rules upstream's installer is made of. Both are
        # named after the ref, so a tag names its archives and a run by hand names the branch.
        env:
          LINUXDEPLOY_SHA256: c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d
          LINUXDEPLOY_QT_SHA256: 15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724
          RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
        run: |
          apps/rtxtool/rtx package build
          mkdir -p dist
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get install -y zsync
            cmake --install build-package --prefix "$PWD/AppDir/usr/bin"
            mv AppDir/usr/bin/share AppDir/usr/share
            curl --fail --retry 3 -L -o linuxdeploy \
              https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
            curl --fail --retry 3 -L -o linuxdeploy-plugin-qt \
              https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage
            curl --fail --retry 3 -L -o runtime-x86_64 \
              https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
            echo "$LINUXDEPLOY_SHA256  linuxdeploy" | sha256sum -c -
            echo "$LINUXDEPLOY_QT_SHA256  linuxdeploy-plugin-qt" | sha256sum -c -
            echo "$RUNTIME_SHA256  runtime-x86_64" | sha256sum -c -
            chmod +x linuxdeploy linuxdeploy-plugin-qt
            executables=()
            for file in AppDir/usr/bin/*; do
              [ -f "$file" ] && [ -x "$file" ] && executables+=(--executable "$file")
            done
            APPIMAGE_EXTRACT_AND_RUN=1 QMAKE=/usr/bin/qmake6 PATH="$PWD:$PATH" \
              LDAI_RUNTIME_FILE="$PWD/runtime-x86_64" LDAI_NO_APPSTREAM=1 \
              LDAI_UPDATE_INFORMATION='gh-releases-zsync|xorza|openmw-rtx|latest|openmw-rtx-v*-linux-x86_64.AppImage.zsync' \
              LDAI_OUTPUT="dist/openmw-${GITHUB_REF_NAME}-linux-x86_64.AppImage" \
              ./linuxdeploy --appdir AppDir "${executables[@]}" \
                --desktop-file AppDir/usr/share/applications/org.openmw.launcher.desktop \
                --icon-file AppDir/usr/share/pixmaps/openmw.png \
                --exclude-library 'libvulkan.so*' --plugin qt --output appimage
            mv ./*.zsync dist/ 2>/dev/null || true
          else
            cpack -G ZIP --config build-package/CPackConfig.cmake -B dist
            rm -rf dist/_CPack_Packages
            mv dist/*.zip "dist/openmw-${GITHUB_REF_NAME}-windows-x64.zip"
          fi
          ls -l dist

      - name: Archive
        if: env.PACKAGE == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

      - name: Logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-${{ matrix.os }}-${{ github.sha }}
          path: |
            build-debug/CMakeCache.txt
            build-debug/**/*.log
            build-nodlss/CMakeCache.txt

  release:
    # A draft, with both archives, on the tag that was pushed. Only this job can write, and it
    # runs on nothing but a release tag; a leg that failed leaves no release at all.
    if: startsWith(github.ref, 'refs/tags/rtx-v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          files: dist/*
          fail_on_unmatched_files: true
