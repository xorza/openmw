name: Reusable MacOS workflow

on:
  workflow_call:
    inputs:
      build-type:
        default: RelWithDebInfo
        type: string
      image:
        description: MacOS Runner image
        required: true
        type: string

jobs:
  MacOS:
    name: ${{ inputs.image }}
    runs-on: ${{ inputs.image }}
    steps:
    - uses: actions/checkout@v6
    - run: echo "CMAKE_BUILD_TYPE=${{ inputs.build-type }}" >> $GITHUB_ENV

    - run: echo "MACOS_AMD64=true" >> $GITHUB_ENV
      if: ${{ inputs.image == 'macos-15-intel' }}

    - name: Install Building Dependencies
      run: CI/before_install.macos.sh

    - name: Prime ccache
      uses: hendrikmuhs/ccache-action@v1.2.22
      with:
        key: ${{ inputs.image }}-${{ inputs.build-type }}
        max-size: 1000M

    - name: Configure
      run: CI/before_script.macos.sh -C
    # **Compiled and not packaged.** This fork ships through `rtx.yml`, and what it asks of macOS is
    # that the tree builds there. The disk image failed the leg on the runner's own "Resource busy"
    # from `hdiutil` (runs 36131251834 and 36226797303), which says nothing about the code.
    - name: Build
      run: CI/macos/build.sh
